# ============================================================
# GitHub Actions 自动评分工作流示例（Python 仿真实验模板仓库用）
# ------------------------------------------------------------
# 用法：
#   1. 为某次实验建「模板仓库」，内置：
#        .github/workflows/autograde.yml   ← 本文件改名后放入
#        tests/test_exp.py                 ← pytest 测试（按测试点给分）
#        exp.py                            ← 学生需要补全的骨架代码
#   2. 学生 Use this template → 复制到自己的仓库 → 补全 exp.py → push
#   3. 每次 push 自动触发：装依赖 → 跑 pytest → 在 Actions 的
#      Summary 页面输出各测试点得分与总分
# ------------------------------------------------------------
# tests/test_exp.py 示例（给分约定：每个测试函数即一个测试点）：
#
#   import math
#   from exp import euler_step, rk4_step
#
#   def test_rk4_accuracy():
#       """RK4 求解 y'=y 一步后的相对误差应小于 1e-6"""
#       y = rk4_step(f=lambda t, y: y, t=0, y=1, h=0.1)
#       assert abs(y - math.exp(0.1)) / math.exp(0.1) < 1e-6
#
#   def test_euler_stability():
#       ...
# ============================================================

name: autograde

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run autograding tests
        run: |
          pytest tests/ -v --tb=short \
            --junitxml=report.xml \
            | tee pytest.log

      - name: Publish score summary
        if: always()
        run: |
          python - <<'EOF'
          import re, xml.etree.ElementTree as ET
          tree = ET.parse("report.xml")
          suite = tree.getroot()
          total = int(suite.get("tests", 0))
          failed = int(suite.get("failures", 0)) + int(suite.get("errors", 0))
          passed = total - failed
          lines = ["## 自动评测结果", "",
                   f"**得分：{passed} / {total} 个测试点通过**", "",
                   "| 测试点 | 结果 |", "|---|---|"]
          for case in suite.iter("testcase"):
              ok = case.find("failure") is None and case.find("error") is None
              lines.append(f"| `{case.get('name')}` | {'✅ 通过' if ok else '❌ 未通过'} |")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          EOF
